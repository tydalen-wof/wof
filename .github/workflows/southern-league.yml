name: Southern League Premier South
on:
  schedule:
    - cron: '30 5 * * 4'   # Thursdays 05:30 UTC, before the 06:47 UK routine
    - cron: '30 5 * * 0'   # Sundays, to catch midweek changes
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/scrape.mjs
      - name: Commit if changed
        run: |
          git config user.name "wof-bot"
          git config user.email "wof-bot@users.noreply.github.com"
          git add data/premier-south.json
          git diff --cached --quiet || (git commit -m "Update Premier South fixtures" && git push)
